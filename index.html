<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EW4All satellite infrastructure &mdash; RA II and RA V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root { --wmo: #005BAA; --ink: #132B45; --muted: #5A6A7C; --line: #DFE6EC; --bg: #F2F6F9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 400 15px/1.5 Arial, Helvetica, sans-serif; }
    h1, h2, .panel-title, .section-label, .coverage-title, .breakdown-label,
    .panel-figure, #tabs button { font-family: Montserrat, Arial, sans-serif; }

    /* header */
    header.site { background: var(--wmo); color: #fff; padding: 26px 34px 22px; display: flex;
                  justify-content: space-between; align-items: flex-end; gap: 30px; flex-wrap: wrap; }
    .site-identity { display: flex; align-items: flex-start; gap: 26px; }
    header.site img { width: 104px; height: auto; display: block; flex: 0 0 auto; margin-top: 4px; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
               text-transform: uppercase; opacity: 0.82; }
    header.site h1 { margin: 8px 0 0; font-size: 30px; font-weight: 800; line-height: 1.15; }
    header.site p { margin: 6px 0 0; color: #D7EAF8; font-size: 15px; line-height: 1.4; }
    .site-sources { font-size: 13px; line-height: 1.55; color: #D7EAF8; text-align: right; }
    .brand-stripe { display: flex; height: 5px; }
    .brand-stripe span { display: block; }

    /* layout */
    main { padding: 22px 34px 46px; max-width: 1560px; margin: 0 auto; }
    #tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    #tabs button { padding: 9px 18px; border: 1px solid var(--line); background: #fff;
                   color: var(--muted); font-weight: 700; font-size: 13px; cursor: pointer;
                   white-space: nowrap; line-height: 1.4; }
    #tabs button.on { background: var(--wmo); border-color: var(--wmo); color: #fff; }
    .section-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
                     text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
    .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(244px, 1fr)); gap: 14px; }
    .stack { display: grid; gap: 14px; margin-bottom: 26px; }

    /* dataset coverage strip */
    .coverage { display: flex; flex-wrap: wrap; gap: 28px; padding: 13px 18px; margin-bottom: 24px;
                background: #E9EDF2; border-left: 4px solid #8C99A6; }
    .coverage-title { flex: 0 0 100%; font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em;
                      text-transform: uppercase; color: var(--muted); }
    .coverage-item { flex: 1; min-width: 250px; }
    .coverage-head { display: flex; justify-content: space-between; align-items: flex-start;
                     gap: 12px; line-height: 1.35; }
    .coverage-head strong { font-size: 17px; white-space: nowrap; }
    .coverage-track { height: 6px; background: #D3DAE1; margin-top: 6px; }
    .coverage-fill { height: 100%; background: var(--muted); }
    .coverage-note { font-size: 11.5px; color: #7C8A99; margin-top: 5px; }

    /* dimension panels: headline figure over the breakdown it comes from */
    .panel { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--wmo);
             display: flex; flex-direction: column; }
    .panel-head { padding: 15px 18px 14px; border-bottom: 1px solid var(--line); }
    .panel-body { padding: 15px 18px 18px; }
    .panel-title { font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
                   text-transform: uppercase; color: var(--muted); }
    .panel-figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px;
                    margin-top: 7px; }
    .panel-figure strong { font-size: 40px; font-weight: 800; line-height: 1; }
    .panel-figure span { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .panel-note { margin: 5px 0 0; font-size: 12.5px; color: var(--muted); }
    .breakdown-label { font-size: 11px; font-weight: 700; letter-spacing: 0.09em;
                       text-transform: uppercase; color: #8C99A6; }
    .breakdown-note { margin: 3px 0 13px; font-size: 12px; color: #98A5B2; }

    /* bars */
    .bar-row { margin-bottom: 11px; }
    .bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
                margin-bottom: 4px; }
    .bar-label { font-size: 13.5px; }
    .bar-label.muted { color: #8C99A6; font-style: italic; }
    .bar-count { font-weight: 700; font-size: 13.5px; font-family: Montserrat, Arial, sans-serif; }
    .bar-track { height: 16px; background: #EDF1F4; }
    .bar-fill { height: 100%; }
    .bar-sub { margin-top: 3px; font-size: 11.5px; color: #8C99A6; }

    /* filters */
    [hidden] { display: none !important; }
    #filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px;
               background: #fff; border: 1px solid var(--line); padding: 14px 16px; }
    #filters label { display: flex; flex-direction: column; gap: 4px; font-size: 11px;
                     font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
                     color: var(--muted); }
    #filters select, #filters input { font: 400 14px Arial, Helvetica, sans-serif; padding: 7px 9px;
                                      border: 1px solid var(--line); background: #fff; min-width: 170px; }
    #filters button { padding: 8px 16px; border: 1px solid var(--wmo); background: #fff;
                      color: var(--wmo); font-weight: 700; font-size: 13px; cursor: pointer;
                      white-space: nowrap; line-height: 1.4; }

    /* country table */
    .match-line { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    .table-wrap { background: #fff; border: 1px solid var(--line); overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    th { background: var(--wmo); color: #fff; text-align: left; padding: 10px 12px;
         font: 700 12px Montserrat, Arial, sans-serif; position: sticky; top: 0; }
    td { padding: 9px 12px; vertical-align: top; border-top: 1px solid #EDF1F4; font-size: 13.5px; }
    .table-wrap tbody tr:hover { background: #F7FAFC; cursor: pointer; }
    td.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
    .sub { font-size: 11.5px; color: #8C99A6; }
    .chip { display: inline-block; padding: 3px 8px; font-size: 12px; font-weight: 700; }

    /* definitions & sources */
    .card { background: #fff; border: 1px solid var(--line); padding: 20px 22px; }
    .card-title { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
    .card-title.tight { margin-bottom: 4px; font-size: 15px; }
    .card-sub { margin: 0 0 14px; font-size: 12.5px; line-height: 1.4; color: #7C8A99; }
    table.dict { font-size: 13px; line-height: 1.45; }
    table.dict th { background: #E9EDF2; color: var(--ink); padding: 8px 10px; position: static;
                    font-size: 12px; }
    table.dict td { padding: 8px 10px; border-top: 0; border-bottom: 1px solid #E4E9ED;
                    color: #25384F; font-size: 13px; }
    table.dict .dict-field { font-weight: 700; color: var(--ink); }
    .scale-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .scale-item { display: flex; gap: 11px; margin-bottom: 11px; }
    .swatch { flex: 0 0 14px; width: 14px; height: 14px; margin-top: 3px; }
    .scale-label { font-size: 13px; font-weight: 700; font-family: Montserrat, Arial, sans-serif; }
    .scale-def { margin-top: 2px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    dl { margin: 0; }
    dt { font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
         color: var(--muted); margin-top: 10px; }
    dd { margin: 3px 0 0; font-size: 13.5px; }
    /* data completeness */
    .comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
    .comp-card { background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--wmo);
                 padding: 18px 20px 20px; }
    .comp-head { display: flex; align-items: baseline; gap: 12px; }
    .comp-count { font: 800 30px/1 Montserrat, Arial, sans-serif; }
    .comp-label { font: 700 14px Montserrat, Arial, sans-serif; }
    .comp-sub { margin: 6px 0 12px; font-size: 12.5px; line-height: 1.4; color: #7C8A99; }
    .comp-members { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-chip { background: var(--bg); border: 1px solid #E4E9ED; padding: 4px 9px;
                   font-size: 12.5px; color: #25384F; }
    .note-card { background: #fff; border: 1px solid var(--line); padding: 18px 20px; margin-bottom: 18px; }
    .note-card h2 { margin: 0; font-size: 15px; }
    .note-card p { margin: 6px 0 0; font-size: 13px; color: var(--muted); max-width: 900px; }

    /* country profile */
    #profile { position: fixed; inset: 0; background: rgba(19, 43, 69, 0.55); overflow: auto;
               padding: 40px 20px; }
    .modal-card { background: #fff; max-width: 720px; margin: 0 auto; padding: 26px 28px; position: relative; }
    .modal-card h2 { margin: 0; font-size: 22px; }
    .modal-close { position: absolute; top: 18px; right: 18px; border: 1px solid var(--line);
                   background: #fff; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .profile-block { border-top: 3px solid var(--wmo); padding-top: 10px; margin-top: 16px; }
    .profile-value { font-weight: 700; font-size: 15px; margin-top: 6px; }
    .profile-note { margin-top: 18px; font-size: 13px; color: var(--muted); }

    @media print { #tabs, #filters, #profile { display: none; } }
</style>
</head>

<header class="site">
  <div class="site-identity">
    <img src="assets/wmo-logo-white.png" alt="World Meteorological Organization">
    <div>
      <div class="eyebrow">World Meteorological Organization &nbsp;&middot;&nbsp; Early Warnings for All</div>
      <h1>Satellite Infrastructure Dashboard</h1>
      <p>Regional Associations II and V &mdash; reception, connectivity, storage and visualisation</p>
    </div>
  </div>
  <div class="site-sources">
    Monitoring Data Collection Campaign 2025<br>
    AOMSUC country reports 2024&ndash;2025<br>
    Preliminary gap analysis, 18 November 2025
  </div>
</header>

<div class="brand-stripe">
  <span style="flex:699;background:#00B5D5"></span>
  <span style="flex:700;background:#70BF54"></span>
  <span style="flex:699;background:#FAA61A"></span>
  <span style="flex:1081;background:#005BAA"></span>
</div>

<main>
  <nav id="tabs"></nav>
  <div id="filters" hidden></div>
  <div id="view"></div>
</main>

<div id="profile" hidden></div>

<script>
/* ------------------------------------------------------------------
   Rendering. Plain browser JavaScript, no build step and no framework.
   Every value shown on the page comes from INFRA_DATA above.
   ------------------------------------------------------------------ */

var state = { tab: 'overview', q: '', region: 'All', delivery: 'All',
              stability: 'All', storage: 'All', software: 'All', status: 'All' };

var ND = INFRA_DATA.ND;
var COUNTRIES = INFRA_DATA.countries;

/* Grouped catch-all buckets. They are shown in the charts but excluded from the
   headline counts of named systems and tools. */
var BUCKET = ['Other online portal', 'In-house platform', 'Other proprietary', 'GIS tools'];

/* One accent colour per infrastructure dimension. */
var ACCENT = { delivery: '#1F7A3D', stability: '#0E8FA8', storage: '#B5460A', software: '#37527A' };

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* Collapses a raw entry to the system it names. Status qualifiers in brackets are
   dropped, but EUMETCast is split by delivery route, since the satellite broadcast
   and the terrestrial service are separate systems. */
function stemName(v) {
  var base = v.replace(/\s*\(.*/, '').trim();
  if (base !== 'EUMETCast') return base;
  return /terrestrial/i.test(v) ? 'EUMETCast Terrestrial' : 'EUMETCast Satellite';
}

function uniq(list) {
  return list.filter(function (v, i) { return list.indexOf(v) === i; }).sort();
}

function matches(c) {
  var s = state;
  if (s.q && c.name.toLowerCase().indexOf(s.q.toLowerCase()) === -1) return false;
  if (s.region !== 'All' && c.region !== s.region) return false;
  if (s.stability !== 'All' && c.stability !== s.stability) return false;
  if (s.storage !== 'All' && c.storage !== s.storage) return false;
  if (s.status !== 'All' && c.status !== s.status) return false;
  if (s.delivery !== 'All' && !c.delivery.some(function (d) { return stemName(d) === s.delivery; })) return false;
  if (s.software !== 'All' && !c.software.some(function (x) { return stemName(x) === s.software; })) return false;
  return true;
}

function colourFor(scaleKey, value) {
  var row = INFRA_DATA[scaleKey].filter(function (r) { return r[0] === value; })[0];
  return row ? row[2] : '#C7D0D9';
}

/* Members naming each distinct system or tool in a field, most used first. */
function tally(field) {
  var counts = {};
  COUNTRIES.forEach(function (c) {
    var seen = [];
    c[field].forEach(function (v) {
      var b = stemName(v);
      if (seen.indexOf(b) > -1) return;
      seen.push(b);
      (counts[b] = counts[b] || []).push(c);
    });
  });
  return Object.keys(counts).map(function (k) {
    return { label: k, members: counts[k], count: counts[k].length };
  }).sort(function (a, b) { return b.count - a.count; });
}

function namedCount(field) {
  return tally(field).filter(function (r) { return BUCKET.indexOf(r.label) === -1; }).length;
}

/* ---------- shared pieces ---------- */

function bar(label, count, max, colour, muted, ra2, ra5) {
  var pct = max ? (count / max * 100) : 0;
  return '<div class="bar-row">' +
    '<div class="bar-head"><span class="bar-label' + (muted ? ' muted' : '') + '">' + esc(label) + '</span>' +
    '<span class="bar-count">' + count + '</span></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + colour + '"></div></div>' +
    '<div class="bar-sub">RA&nbsp;II ' + ra2 + ' &nbsp; RA&nbsp;V ' + ra5 + '</div></div>';
}

function scaleBars(scaleKey, field) {
  var rows = INFRA_DATA[scaleKey].map(function (r) {
    var hits = COUNTRIES.filter(function (c) { return c[field] === r[0]; });
    return { label: r[0], colour: r[2], count: hits.length,
             ra2: hits.filter(function (c) { return c.region === 'RA II'; }).length,
             ra5: hits.filter(function (c) { return c.region === 'RA V'; }).length };
  });
  var max = Math.max.apply(null, rows.map(function (r) { return r.count; }).concat([1]));
  return rows.map(function (r) {
    return bar(r.label, r.count, max, r.colour, false, r.ra2, r.ra5);
  }).join('');
}

function listBars(field, accent) {
  var rows = tally(field).slice(0, 9);
  if (field === 'delivery') {
    (INFRA_DATA.deliveryNoUsers || []).forEach(function (n) {
      rows.push({ label: n + ' \u2014 no reported users', members: [], count: 0, noUsers: true });
    });
  }
  var max = Math.max.apply(null, rows.map(function (r) { return r.count; }).concat([1]));
  return rows.map(function (r) {
    var grouped = BUCKET.indexOf(r.label) > -1;
    var muted = grouped || r.noUsers;
    return bar(r.label + (grouped ? ' \u2014 grouped category' : ''), r.count, max,
      muted ? '#C2D0DA' : accent, muted,
      r.members.filter(function (c) { return c.region === 'RA II'; }).length,
      r.members.filter(function (c) { return c.region === 'RA V'; }).length);
  }).join('');
}

/* ---------- tab: regional overview ---------- */

function panel(key, title, figure, unit, note, breakdownLabel, breakdownNote, bars) {
  var a = ACCENT[key];
  return '<section class="panel" style="border-top-color:' + a + '">' +
    '<header class="panel-head" style="background:' + a + '12;border-bottom-color:' + a + '2e">' +
      '<div class="panel-title">' + esc(title) + '</div>' +
      '<div class="panel-figure"><strong style="color:' + a + '">' + figure + '</strong>' +
      '<span style="color:' + a + '">' + esc(unit) + '</span></div>' +
      '<p class="panel-note">' + esc(note) + '</p>' +
    '</header>' +
    '<div class="panel-body">' +
      '<div class="breakdown-label">' + esc(breakdownLabel) + '</div>' +
      '<p class="breakdown-note">' + esc(breakdownNote) + '</p>' + bars +
    '</div></section>';
}

function renderOverview() {
  var reporting = COUNTRIES.filter(function (c) { return c.status !== 'No information'; }).length;
  var complete = COUNTRIES.filter(function (c) { return c.status === 'Complete'; }).length;
  var total = COUNTRIES.length;
  var ra2 = COUNTRIES.filter(function (c) { return c.region === 'RA II'; }).length;
  var ra5 = COUNTRIES.filter(function (c) { return c.region === 'RA V'; }).length;

  var nStab = COUNTRIES.filter(function (c) { return c.stability !== ND; }).length;
  var nStor = COUNTRIES.filter(function (c) { return c.storage !== ND; }).length;
  var unstable = COUNTRIES.filter(function (c) { return c.stability === 'Unstable'; }).length;
  var noArch = COUNTRIES.filter(function (c) {
    return c.storage === 'No long-term archive' || c.storage === 'Limited long-term archive'; }).length;

  var coverage =
    '<div class="coverage">' +
      '<div class="coverage-title">Dataset coverage \u2014 how much has been reported so far</div>' +
      [['Countries and territories with information', reporting + ' / ' + total,
        ra2 + ' RA II \u00b7 ' + ra5 + ' RA V \u00b7 ' + (total - reporting) + ' still to be contacted',
        Math.round(reporting / total * 100)],
       ['Complete records', complete + ' / ' + total,
        'all three dimensions carry a reported value',
        Math.round(complete / total * 100)]].map(function (v) {
        return '<div class="coverage-item">' +
          '<div class="coverage-head"><span>' + esc(v[0]) + '</span><strong>' + esc(v[1]) + '</strong></div>' +
          '<div class="coverage-track"><div class="coverage-fill" style="width:' + v[3] + '%"></div></div>' +
          '<div class="coverage-note">' + esc(v[2]) + '</div></div>';
      }).join('') +
    '</div>';

  return coverage +
    '<div class="section-label">Infrastructure dimensions \u2014 a fixed regional summary of all ' + total +
      ' countries and territories; use the filters on the Country data tab</div>' +
    '<div class="panel-grid">' +
      panel('delivery', 'Delivery systems in use', namedCount('delivery'), 'named systems',
        'named broadcast services and portals; grouped categories are shown below but not counted here',
        'Most widely used',
        'Credited only where the country\u2019s own answer names the system; top nine shown',
        listBars('delivery', ACCENT.delivery)) +
      panel('stability', 'Internet connection stability', unstable, 'of ' + nStab,
        'report an unstable connection, of those with a reported value',
        'Reported stability', 'Campaign Part D, plus AOMSUC where stated',
        scaleBars('stabilityScale', 'stability')) +
      panel('storage', 'Long-term storage capacity', noArch, 'of ' + nStor,
        'have a limited or absent archive, of those with a reported value',
        'Reported capacity', 'AOMSUC narratives, coded into four tiers',
        scaleBars('storageScale', 'storage')) +
      panel('software', 'Visualisation software', namedCount('software'), 'named tools',
        'named tools \u2014 no shared regional standard; grouped categories are shown below but not counted here',
        'Most widely used',
        'Union of the 18 Nov report table and the consolidated country tables; top nine shown',
        listBars('software', ACCENT.software)) +
    '</div>';
}

/* ---------- tab: country data ---------- */

function chip(value, colour) {
  return '<span class="chip" style="background:' + colour + '1f;color:' + colour + '">' + esc(value) + '</span>';
}

function renderTable() {
  var shown = COUNTRIES.filter(matches);
  var head = ['Country / territory', 'Delivery systems', 'Internet stability',
              'Long-term storage', 'Visualisation software', 'Status'];
  var body;
  if (!shown.length) {
    var noUser = (INFRA_DATA.deliveryNoUsers || []).indexOf(state.delivery) > -1;
    body = '<tr><td colspan="6" class="empty">' + (noUser
      ? 'No Member has reported ' + esc(state.delivery) +
        '. The route is listed so its absence is visible; the empty result is the finding.'
      : 'No countries or territories match the current filters. Clear the filters to see all ' +
        COUNTRIES.length + ' again.') + '</td></tr>';
  } else {
    body = shown.map(function (c) {
      return '<tr data-country="' + esc(c.name) + '">' +
        '<td><strong>' + esc(c.name) + '</strong><div class="sub">' + esc(c.region) + ' \u00b7 ' +
          esc(c.subregion) + '</div></td>' +
        '<td>' + esc(c.delivery.length ? c.delivery.join(' \u00b7 ') : ND) + '</td>' +
        '<td>' + chip(c.stability, colourFor('stabilityScale', c.stability)) + '</td>' +
        '<td>' + chip(c.storage, colourFor('storageScale', c.storage)) + '</td>' +
        '<td>' + esc(c.software.length ? c.software.join(' \u00b7 ') : ND) + '</td>' +
        '<td>' + esc(c.status) + '</td></tr>';
    }).join('');
  }
  return '<p class="match-line">' + (shown.length === COUNTRIES.length
      ? 'Showing all ' + COUNTRIES.length + ' countries and territories.'
      : 'Showing ' + shown.length + ' of ' + COUNTRIES.length + ' countries and territories.') + '</p>' +
    '<div class="table-wrap"><table><thead><tr>' +
      head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

/* ---------- tab: data completeness ---------- */

/* Reporting groups, worst first: the tab exists to show who to contact next. */
var COMPLETENESS_GROUPS = [
  ['No information', '#B5460A', 'Nothing reported on any of the three dimensions \u2014 first priority to contact.'],
  ['Partial', '#FAA61A', 'Some dimensions reported; the rest still open.'],
  ['Complete', '#1F7A3D', 'All three dimensions carry a reported value.']
];

function renderCompleteness() {
  var cards = COMPLETENESS_GROUPS.map(function (g) {
    var list = COUNTRIES.filter(function (c) { return c.status === g[0]; });
    var chips = list.map(function (c) {
      return '<span class="member-chip">' + esc(c.name) + '</span>';
    }).join('');
    return '<section class="comp-card" style="border-top-color:' + g[1] + '">' +
      '<div class="comp-head">' +
        '<span class="comp-count" style="color:' + g[1] + '">' + list.length + '</span>' +
        '<span class="comp-label">' + esc(g[0]) + '</span>' +
      '</div>' +
      '<p class="comp-sub">' + esc(g[2]) + '</p>' +
      '<div class="comp-members">' + chips + '</div>' +
      '</section>';
  }).join('');

  return '<div class="note-card">' +
      '<h2>Who still needs to be contacted</h2>' +
      '<p>Completeness counts the three dashboard dimensions: internet stability, long-term storage ' +
      'and visualisation software. A Member is complete only when all three carry a reported value.</p>' +
    '</div>' +
    '<div class="comp-grid">' + cards + '</div>';
}

/* ---------- tab: definitions & sources ---------- */

/* Category scales shown as cards beneath the dictionary. The colour is the one
   the charts use for that value, so the legend and the bars agree. */
var SCALE_CARDS = [
  ['Internet connection stability', 'stabilityScale',
   'Judge against operational use of 10-minute geostationary imagery.'],
  ['Long-term storage capacity', 'storageScale',
   'Refers to archiving satellite data beyond immediate operational use.']
];

function renderMethod() {
  var dictRows = DEFINITIONS.map(function (d) {
    return '<tr>' +
      '<td class="dict-field">' + esc(d.field) + '</td>' +
      '<td>' + esc(d.source) + '</td>' +
      '<td>' + esc(d.question) + '</td>' +
      '</tr>';
  }).join('');

  var dictionary =
    '<section class="card">' +
      '<h2 class="card-title">Data dictionary</h2>' +
      '<table class="dict"><thead><tr>' +
        '<th style="width:22%">Field</th>' +
        '<th style="width:34%">Source dataset</th>' +
        '<th>Source question or field</th>' +
      '</tr></thead><tbody>' + dictRows + '</tbody></table>' +
    '</section>';

  var scales = SCALE_CARDS.map(function (s) {
    var items = INFRA_DATA[s[1]].map(function (r) {
      return '<div class="scale-item">' +
        '<span class="swatch" style="background:' + r[2] + '"></span>' +
        '<div><div class="scale-label">' + esc(r[0]) + '</div>' +
        '<div class="scale-def">' + esc(r[1]) + '</div></div></div>';
    }).join('');
    return '<section class="card">' +
      '<h2 class="card-title tight">' + esc(s[0]) + '</h2>' +
      '<p class="card-sub">' + esc(s[2]) + '</p>' + items +
      '</section>';
  }).join('');

  return '<div class="stack">' + dictionary +
    '<div class="scale-grid">' + scales + '</div></div>';
}

/* ---------- country profile ---------- */

var SOURCE_LABEL = { SC: 'Monitoring Campaign 2025 scorecard', RPT: 'Gap analysis, 18 November 2025',
                     A24: 'AOMSUC country report 2024', A25: 'AOMSUC country report 2025',
                     MU: 'Member update' };

function sourceLabel(tag) {
  if (!tag) return 'Not recorded';
  return tag.split('/').map(function (t) { return SOURCE_LABEL[t.trim()] || t.trim(); }).join(' + ');
}

function openProfile(name) {
  var c = COUNTRIES.filter(function (x) { return x.name === name; })[0];
  if (!c) return;
  var blocks = [
    ['Delivery systems', c.delivery.length ? c.delivery.join(', ') : ND, c.deliverySrc, '#1F7A3D'],
    ['Internet stability', c.stability, c.stabSrc, colourFor('stabilityScale', c.stability)],
    ['Internet speed', c.speed, c.stabSrc, '#0E8FA8'],
    ['Long-term storage', c.storage, c.storageSrc, colourFor('storageScale', c.storage)],
    ['Visualisation software', c.software.length ? c.software.join(', ') : ND, c.softwareSrc, '#37527A']
  ];
  document.getElementById('profile').innerHTML =
    '<div class="modal-card">' +
      '<button class="modal-close" data-close="yes">Close</button>' +
      '<h2>' + esc(c.name) + '</h2>' +
      '<p class="sub">' + esc(c.region) + ' \u00b7 ' + esc(c.subregion) + ' \u00b7 ' + esc(c.status) + '</p>' +
      blocks.map(function (b) {
        return '<div class="profile-block" style="border-top-color:' + b[3] + '">' +
          '<div class="breakdown-label">' + esc(b[0]) + '</div>' +
          '<div class="profile-value">' + esc(b[1]) + '</div>' +
          '<div class="sub">' + esc(sourceLabel(b[2])) + '</div></div>';
      }).join('') +
      (c.note ? '<p class="profile-note">' + esc(c.note) + '</p>' : '') +
    '</div>';
  document.getElementById('profile').hidden = false;
}

function closeProfile() {
  document.getElementById('profile').hidden = true;
  document.getElementById('profile').innerHTML = '';
}

/* ---------- filters and chrome ---------- */

function renderFilters() {
  var deliveryNames = uniq([].concat.apply([], COUNTRIES.map(function (c) {
    return c.delivery.map(stemName); }))).concat(INFRA_DATA.deliveryNoUsers || []);
  var softwareNames = uniq([].concat.apply([], COUNTRIES.map(function (c) {
    return c.software.map(stemName); })));
  var defs = [
    ['region', 'Region', ['RA II', 'RA V']],
    ['delivery', 'Delivery system', deliveryNames],
    ['stability', 'Internet stability', INFRA_DATA.stabilityScale.map(function (r) { return r[0]; })],
    ['storage', 'Storage capacity', INFRA_DATA.storageScale.map(function (r) { return r[0]; })],
    ['software', 'Visualisation software', softwareNames],
    ['status', 'Data status', ['Complete', 'Partial', 'No information']]
  ];
  return '<input id="q" type="search" placeholder="Search country or territory" value="' + esc(state.q) + '">' +
    defs.map(function (d) {
      return '<label>' + esc(d[1]) + '<select data-key="' + d[0] + '">' +
        ['All'].concat(d[2]).map(function (o) {
          return '<option' + (state[d[0]] === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select></label>';
    }).join('') +
    '<button id="clear">Clear filters</button>';
}

var TABS = [['overview', 'Regional overview'], ['table', 'Country data'],
            ['completeness', 'Data completeness'], ['method', 'Definitions &amp; sources']];

/* Only the results. The filter controls are left alone so typing in the search
   box does not destroy the field the user is typing into. */
function renderView() {
  document.getElementById('view').innerHTML =
    state.tab === 'overview' ? renderOverview() :
    state.tab === 'table' ? renderTable() :
    state.tab === 'completeness' ? renderCompleteness() : renderMethod();
}

/* Everything, including the tabs and the filter controls. Used on load, on a tab
   change and when the filters are reset. */
function render() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    return '<button data-tab="' + t[0] + '"' + (state.tab === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>';
  }).join('');

  var filters = document.getElementById('filters');
  filters.hidden = state.tab !== 'table';
  if (!filters.hidden) filters.innerHTML = renderFilters();

  renderView();
}

document.addEventListener('click', function (e) {
  var tab = e.target.closest('[data-tab]');
  if (tab) {
    state.tab = tab.getAttribute('data-tab');
    render();
    return;
  }

  var row = e.target.closest('[data-country]');
  if (row) {
    openProfile(row.getAttribute('data-country'));
    return;
  }

  // the Close button, or a click on the backdrop outside the card
  if (e.target.closest('[data-close]') || e.target.id === 'profile') {
    closeProfile();
    return;
  }

  if (e.target.id === 'clear') {
    state = { tab: 'table', q: '', region: 'All', delivery: 'All',
              stability: 'All', storage: 'All', software: 'All', status: 'All' };
    render();
  }
});

document.addEventListener('change', function (e) {
  var key = e.target.getAttribute && e.target.getAttribute('data-key');
  if (key) { state[key] = e.target.value; renderView(); }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { state.q = e.target.value; renderView(); }
});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeProfile(); });

render();
</script>

</body>
</html>
