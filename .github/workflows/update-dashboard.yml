name: Update dashboard from workbook

# Regenerates the country data in index.html whenever the Member update
# workbook is pushed, then commits the result. Nothing else is rebuilt.

on:
  push:
    paths:
      - 'data/*.xlsx'
      - 'tools/build_data.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: pip install openpyxl==3.1.5

      - name: Regenerate index.html from the workbook
        run: python3 tools/build_data.py

      - name: Commit the result
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already matches the workbook — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update dashboard data from ${{ github.event.head_commit.message || 'workbook' }}"
          git push

